openapi: 3.0.3
info:
  title: I Was Here Service API
  version: 1.0.0
  description: I Was Here Service API built with NestJS
servers:
  - url: http://localhost:3000
    description: Development server
paths:
  /auth/register:
    post:
      operationId: registerUser
      summary: Register a new user
      description: Create a new user account with username, email, and password
      security: []
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
  /auth/log-in:
    post:
      operationId: loginUser
      summary: Acquire access tokens
      description: Acquire access tokens by providing correct identifier (username or email) and password
      security: []
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: User successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/LocalUnauthorizedError'
  /auth/log-out:
    post:
      operationId: logoutUser
      summary: Blacklist access tokens
      description: Blacklists user's refresh and JWT tokens
      security: 
        - bearerAuth: []
      tags:
        - Authentication
      responses:
        '204':
          description: User logged out successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /auth/refresh-token:
    post:
      operationId: refreshToken
      summary: Renew JWT token
      description: Blacklist the old refresh token and provide new refresh JWT tokens
      security: 
        - refreshToken: []
      tags:
        - Authentication
      responses:
        '201':
          description: Tokens successfully refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/RefreshUnauthorizedError'

components:
  securitySchemes: 
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshToken:
      type: apiKey
      in: header
      name: refresh-token
      description: Refresh token for renewing JWT
  responses:
    BadRequestError:
      description: Missing required parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Required parameters are missing
            error: Bad Request
            statusCode: 400
    JwtUnauthorizedError:
      description: Failure to provide a valid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: 'Authentication Failed'
            error: 'Unauthorized'
            statusCode: 401
    RefreshUnauthorizedError:
      description: Failure to provide a valid Refresh token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: 'Authentication Failed'
            error: 'Unauthorized'
            statusCode: 401
    LocalUnauthorizedError:
      description: Provided credentials were invalid
      content: 
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: 'Invalid Credentials'
            error: 'Unauthorized'
            statusCode: 401
    UnprocessableEntityError:
      description: Provided parameters are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Failed to validate parameters
            error: Unprocessable Entity
            statusCode: 422
    ConflictError:
      description: Provided parameters conflict with the current state of the server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Parameters conflict with the current state of the server
            error: Conflict
            statusCode: 409 
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Message describing the error
        error:
          type: string
          description: Error type
        statusCode:
          type: integer
          description: HTTP status status code
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          description: Unique username for the user
          example: johndoe
        email:
          type: string
          format: email
          description: Unique email address
          example: john.doe@example.com
        password:
          type: string
          pattern: '/^(?=.*[A-Z])(?=.*\d).{8,}$/'
          minLength: 8
          description: User password
          example: securePassword123
    RegisterResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Refresh token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Username or email address
          example: johndoe
        password:
          type: string
          description: User password
          example: securePassword123
    LoginResponse:
      type: object
      properties:
        accessToken:
            type: string
            description: JWT access token
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Refresh token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    RefreshResponse:
      type: object
      properties:
        accessToken:
            type: string
            description: JWT access token
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Refresh token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    User:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: User UUID
          example: 123e4567-e89b-12d3-a456-426614174000
        username:
          type: string
          description: Username
          example: johndoe
        email:
          type: string
          format: email
          description: Email address
          example: john.doe@example.com
        createdAt:
          type: string
          format: date-time
          description: User creation timestamp
          example: 2023-01-01T00:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: User last update timestamp
          example: 2023-01-01T00:00:00Z
        deletedAt:
          type: string
          nullable: true
          format: date-time
          description: User soft deletion timestamp
          example: null