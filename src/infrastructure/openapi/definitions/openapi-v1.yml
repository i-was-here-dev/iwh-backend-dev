openapi: 3.0.3
info:
  title: I Was Here Service API
  version: 1.0.0
  description: I Was Here Service API built with NestJS
servers:
  - url: http://localhost:3000
    description: Development server
paths:
  /auth/register:
    post:
      operationId: registerUser
      summary: Register a new user
      description: Create a new user account with username, email, and password
      security: []
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
  /auth/log-in:
    post:
      operationId: loginUser
      summary: Acquire access tokens
      description: Acquire access tokens by providing correct identifier (username or email) and password
      security: []
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: User successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/LocalUnauthorizedError'
  /auth/log-out:
    post:
      operationId: logoutUser
      summary: Blacklist access tokens
      description: Blacklists user's refresh and JWT tokens
      security: 
        - bearerAuth: []
      tags:
        - Authentication
      responses:
        '204':
          description: User logged out successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /auth/refresh-token:
    post:
      operationId: refreshToken
      summary: Renew JWT token
      description: Blacklist the old refresh token and provide new refresh JWT tokens
      security: 
        - refreshToken: []
      tags:
        - Authentication
      responses:
        '201':
          description: Tokens successfully refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/RefreshUnauthorizedError'
  /posts:
    post:
      operationId: savePost
      summary: Create a new post
      description: Create a new post with location data, text content, and optional media attachments
      security:
        - bearerAuth: []
      tags:
        - Posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePostRequest'
      responses:
        '201':
          description: Post successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavePostResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
  /posts/bounding-box:
    get:
      operationId: findPostsInBoundingBox
      summary: Find posts within a bounding box
      description: Retrieve posts within a specified rectangular area defined by center coordinates and dimensions
      security:
        - bearerAuth: []
      tags:
        - Posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindPostsInBoundingBoxRequest'
      responses:
        '200':
          description: Posts within bounding box successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FindPostsInBoundingBoxResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
  /posts/vicinity:
    get:
      operationId: findPostsInVicinity
      summary: Find posts in user's vicinity
      description: Retrieve posts within 15 meters of the user's current location, sorted by approval count with engagement metrics
      security:
        - bearerAuth: []
      tags:
        - Posts
      parameters:
        - name: page
          in: query
          required: false
          description: Page number for pagination (default is 1)
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindPostsInVicinityRequest'
      responses:
        '200':
          description: Posts in vicinity successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FindPostsInVicinityResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
  /posts/{uuid}:
    get:
      operationId: findPostByUuid
      summary: Get post details by UUID
      description: Retrieve a post with its creator information, comments, and approval count by providing the user's current location to verify they are within proximity
      security:
        - bearerAuth: []
      tags:
        - Posts
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of the post to retrieve
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindPostByUuidRequest'
      responses:
        '200':
          description: Post details successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindPostByUuidResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
  /posts/{uuid}/approvals:
    post:
      operationId: saveApproval
      summary: Create approval for a post
      description: Create an approval for a specific post by providing the user's current location to verify they are at the post location
      security:
        - bearerAuth: []
      tags:
        - Posts
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of the post to approve
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveApprovalRequest'
      responses:
        '204':
          description: Approval successfully created
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
    delete:
      operationId: deleteApproval
      summary: Delete approval for a post
      description: Delete an existing approval for a specific post by providing the user's current location to verify they are at the post location
      security:
        - bearerAuth: []
      tags:
        - Posts
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of the post to remove approval from
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteApprovalRequest'
      responses:
        '204':
          description: Approval successfully deleted
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
  /posts/{postUuid}/comments:
    post:
      operationId: saveComment
      summary: Create a comment on a post
      description: Create a new comment on a specific post by providing the user's current location to verify they are near the post location
      security:
        - bearerAuth: []
      tags:
        - Comments
      parameters:
        - name: postUuid
          in: path
          required: true
          description: UUID of the post to comment on
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCommentRequest'
      responses:
        '201':
          description: Comment successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveCommentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
  /posts/comments/{commentUuid}:
    patch:
      operationId: updateComment
      summary: Update a comment
      description: Update an existing comment's content by providing the user's current location to verify they are near the original post location
      security:
        - bearerAuth: []
      tags:
        - Comments
      parameters:
        - name: commentUuid
          in: path
          required: true
          description: UUID of the comment to update
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Comment successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCommentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
    delete:
      operationId: softDeleteComment
      summary: Soft delete a comment
      description: Soft delete a comment by marking it as deleted, requiring the user's current location to verify they are near the original post location
      security:
        - bearerAuth: []
      tags:
        - Comments
      parameters:
        - name: commentUuid
          in: path
          required: true
          description: UUID of the comment to soft delete
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoftDeleteCommentRequest'
      responses:
        '204':
          description: Comment successfully soft deleted
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
  /profile/me:
    get:
      operationId: findProfileByUserId
      summary: Get current user's profile
      description: Retrieve the authenticated user's profile information including posts, comments, and profile details
      security:
        - bearerAuth: []
      tags:
        - Profile
      responses:
        '200':
          description: User profile successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateProfile
      summary: Update current user's profile
      description: Update the authenticated user's profile information including nickname and profile picture
      security:
        - bearerAuth: []
      tags:
        - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: User profile successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
  /profile/{uuid}:
    get:
      operationId: findProfileByUuid
      summary: Get user profile by UUID
      description: Retrieve a user's profile information including posts, comments, and profile details by their profile UUID
      security:
        - bearerAuth: []
      tags:
        - Profile
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of the profile to retrieve
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174001
      responses:
        '200':
          description: User profile successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /users:
    delete:
      operationId: softDeleteUser
      summary: Soft delete current user account
      description: Soft delete the authenticated user's account by marking it as deleted rather than permanently removing it
      security:
        - bearerAuth: []
      tags:
        - Users
      responses:
        '204':
          description: User account successfully soft deleted
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /users/{uuid}:
    get:
      operationId: findUserByUuid
      summary: Get user by UUID
      description: Retrieve a user's basic information by their UUID
      security:
        - bearerAuth: []
      tags:
        - Users
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of the user to retrieve
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174001
      responses:
        '200':
          description: User successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindUserByUuidResponse'
        '401':
          $ref: '#/components/responses/JwtUnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  securitySchemes: 
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshToken:
      type: apiKey
      in: header
      name: refresh-token
      description: Refresh token for renewing JWT
  responses:
    BadRequestError:
      description: Missing required parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Required parameters are missing
            error: Bad Request
            statusCode: 400
    JwtUnauthorizedError:
      description: Failure to provide a valid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: 'Authentication Failed'
            error: 'Unauthorized'
            statusCode: 401
    RefreshUnauthorizedError:
      description: Failure to provide a valid Refresh token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: 'Authentication Failed'
            error: 'Unauthorized'
            statusCode: 401
    LocalUnauthorizedError:
      description: Provided credentials were invalid
      content: 
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: 'Invalid Credentials'
            error: 'Unauthorized'
            statusCode: 401
    UnprocessableEntityError:
      description: Provided parameters are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Failed to validate parameters
            error: Unprocessable Entity
            statusCode: 422
    ConflictError:
      description: Provided parameters conflict with the current state of the server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Parameters conflict with the current state of the server
            error: Conflict
            statusCode: 409
    ForbiddenError:
      description: User is not authorized to perform this action or does not meet location requirements
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: 'User is not near post'
            error: 'Forbidden'
            statusCode: 403
    NotFoundError:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: 'Not Found'
            error: 'Not Found'
            statusCode: 404 
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Message describing the error
        error:
          type: string
          description: Error type
        statusCode:
          type: integer
          description: HTTP status status code
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
        - nickname
      properties:
        username:
          type: string
          minLength: 3
          description: Unique username for the user
          example: johndoe
        email:
          type: string
          format: email
          description: Unique email address
          example: john.doe@example.com
        password:
          type: string
          pattern: '/^(?=.*[A-Z])(?=.*\d).{8,}$/'
          minLength: 8
          description: User password (must be at least 8 characters long, contain at least one uppercase letter and one digit)
          example: securePassword123
        nickname:
          type: string
          description: User's display nickname
          example: JohnDoe2024
        profilePictureName:
          type: string
          description: Optional profile picture filename
          example: profile_12345.jpg
    RegisterResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        profile:
          type: object
          properties:
            uuid:
              type: string
              format: uuid
              description: Profile UUID
              example: profile-uuid-456
            nickname:
              type: string
              description: User's display nickname
              example: JohnDoe2024
            profilePictureName:
              type: string
              nullable: true
              description: Profile picture filename
              example: profile_12345.jpg
            points:
              type: integer
              description: User's points
              example: 0
        accessToken:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Refresh token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Username or email address
          example: johndoe
        password:
          type: string
          description: User password
          example: securePassword123
    LoginResponse:
      type: object
      properties:
        accessToken:
            type: string
            description: JWT access token
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Refresh token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    RefreshResponse:
      type: object
      properties:
        accessToken:
            type: string
            description: JWT access token
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Refresh token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    SavePostRequest:
      type: object
      required:
        - latitude
        - longitude
        - title
        - body
      properties:
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          description: Post location latitude
          example: 40.7589
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          description: Post location longitude
          example: -73.9851
        title:
          type: string
          maxLength: 20
          description: Post title
          example: Beautiful sunset
        body:
          type: string
          maxLength: 200
          description: Post content
          example: Amazing view from the top of the mountain
        imageName:
          type: string
          description: Optional image filename
          example: sunset_photo_001.jpg
        videoName:
          type: string
          description: Optional video filename
          example: sunset_video_001.mp4
    SavePostResponse:
      type: object
      properties:
        post:
          type: object
          properties:
            uuid:
              type: string
              format: uuid
              description: Post UUID
              example: 123e4567-e89b-12d3-a456-426614174002
            latitude:
              type: number
              format: float
              description: Post location latitude
              example: 40.7589
            longitude:
              type: number
              format: float
              description: Post location longitude
              example: -73.9851
            title:
              type: string
              description: Post title
              example: Beautiful sunset
            body:
              type: string
              description: Post content
              example: Amazing view from the top of the mountain
            imageName:
              type: string
              nullable: true
              description: Image filename
              example: sunset_photo_001.jpg
            videoName:
              type: string
              nullable: true
              description: Video filename
              example: sunset_video_001.mp4
            createdAt:
              type: string
              format: date-time
              description: Post creation timestamp
              example: 2025-11-24T10:30:00Z
            updatedAt:
              type: string
              format: date-time
              description: Post last update timestamp
              example: 2025-11-24T10:30:00Z
            deletedAt:
              type: string
              nullable: true
              format: date-time
              description: Post soft deletion timestamp
              example: null
          format: date-time
          description: Post soft deletion timestamp
          example: null
    FindPostByUuidRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: User's current latitude for location validation
          example: 40.7128
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: User's current longitude for location validation
          example: -74.0060
    FindPostByUuidResponse:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: Post UUID
          example: 123e4567-e89b-12d3-a456-426614174002
        latitude:
          type: number
          format: float
          description: Post location latitude
          example: 40.7589
        longitude:
          type: number
          format: float
          description: Post location longitude
          example: -73.9851
        title:
          type: string
          description: Post title
          example: Beautiful sunset
        body:
          type: string
          description: Post content
          example: Amazing view from the top of the mountain
        imageName:
          type: string
          nullable: true
          description: Image filename
          example: sunset_photo_001.jpg
        videoName:
          type: string
          nullable: true
          description: Video filename
          example: sunset_video_001.mp4
        createdAt:
          type: string
          format: date-time
          description: Post creation timestamp
          example: 2025-11-24T10:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: Post last update timestamp
          example: 2025-11-24T10:30:00Z
        creator:
          type: object
          description: User profile of the post creator
          properties:
            uuid:
              type: string
              format: uuid
              description: User profile UUID
              example: 987e4567-e89b-12d3-a456-426614174999
            nickname:
              type: string
              description: User's display nickname
              example: JohnDoe2024
            profilePictureName:
              type: string
              nullable: true
              description: Profile picture filename
              example: profile_pic_001.jpg
        comments:
          type: array
          description: List of comments on the post
          items:
            type: object
